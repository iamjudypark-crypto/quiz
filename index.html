<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무료 애착유형 검사</title>
<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:#f5f0e8;
min-height:100vh;
color:#333;
}
.wrap{max-width:800px;margin:auto;padding:20px}
.card{
background:#ffffff;
border-radius:24px;
padding:24px;
box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.btn{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #ddd0c0;
border-radius:16px;
background:#f3ebe0;
color:#333;
cursor:pointer;
text-align:left
}
.btn:hover{
background:#e8dccb;
}
.center{text-align:center}
.hidden{display:none}
.progress{display:flex;gap:6px;margin-bottom:20px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.2);flex:1}
.active{background:#8b7355}
.done{background:#c7b299}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trait{
background:#f3ebe0;
padding:10px;
border-radius:12px;
text-align:center;
color:#333;
}
.cta{
display:inline-block;
margin-top:20px;
padding:12px 20px;
background:#8b7355;
color:#fff;
text-decoration:none;
border-radius:12px
}
</style>
</head>
<body>
<div class="wrap">
<div id="welcome" class="center">
<h1>무료 애착유형 검사</h1>
<p>다른 사람과 어떻게 연결되는지 이해하면 관계를 변화시키고 자기 인식을 깊게 할 수 있습니다.</p>
<button onclick="startTest()" class="btn" style="max-width:250px;text-align:center">시작하기</button>
</div>

<div id="quiz" class="hidden">
<div class="progress" id="progress"></div>
<div class="card">
<h2 id="question"></h2>
<div id="options"></div>
</div>
</div>

<div id="result" class="hidden">
<div class="card">
<h2 id="title"></h2>
<p id="desc"></p>

<h3>당신의 강점</h3>
<div class="traits" id="traits"></div>

<h3>성장 방향</h3>
<p id="growth"></p>

<p style="margin-top:25px">
애착유형은 사람을 규정하는 것이 아니라 관계 패턴을 이해하기 위한 하나의 단서입니다.
관계의 어려움이 반복되거나 연애·부부관계에서 비슷한 문제가 계속된다면 상담을 통해 보다 깊이 이해할 수 있습니다.
</p>

<a class="cta" href="https://mindlounge.co.kr/56l9h423" target="_blank">상담 문의하기</a>
<br><br>
<button onclick="restart()" class="btn">다시 테스트하기</button>
</div>
</div>
</div>

<script>
const questions=[
{text:"소중한 사람이 거리를 두면, 나는...",options:[
{text:"언제든 연락할 수 있게 하면서 공간을 준다",score:{secure:3,anxious:0,avoidant:1,fearful:1}},
{text:"그 사람이 나에게 흥미를 잃는 건 아닐까 걱정한다",score:{secure:0,anxious:3,avoidant:0,fearful:2}},
{text:"내 삶의 다른 일에 집중한다",score:{secure:1,anxious:0,avoidant:3,fearful:1}},
{text:"혼란스러워서 나도 거리를 둔다",score:{secure:0,anxious:1,avoidant:1,fearful:3}}]},
{text:"관계에서 나는 이것이 가장 쉽다...",options:[
{text:"솔직하고 개방적으로 내 감정을 나눈다",score:{secure:3,anxious:1,avoidant:0,fearful:0}},
{text:"취약해 보여도 내 필요를 표현한다",score:{secure:2,anxious:3,avoidant:0,fearful:1}},
{text:"나의 일부를 비공개로 유지한다",score:{secure:0,anxious:0,avoidant:3,fearful:2}},
{text:"친밀함과 독립 사이에서 갈등한다",score:{secure:0,anxious:1,avoidant:1,fearful:3}}]},
{text:"다른 사람에게 의지하는 것에 대해, 나는...",options:[
{text:"필요할 때 도움을 요청하는 게 편하다",score:{secure:3,anxious:1,avoidant:0,fearful:0}},
{text:"가까운 사람들에게 자주 확신을 구한다",score:{secure:0,anxious:3,avoidant:0,fearful:1}},
{text:"혼자 해결하는 걸 선호한다",score:{secure:0,anxious:0,avoidant:3,fearful:1}},
{text:"지지를 원하지만 부담될까 두렵다",score:{secure:1,anxious:1,avoidant:1,fearful:3}}]},
{text:"나의 이상적인 관계 방식은...",options:[
{text:"함께 있음과 독립 사이의 균형",score:{secure:3,anxious:0,avoidant:1,fearful:0}},
{text:"많은 시간과 정서적 친밀감",score:{secure:1,anxious:3,avoidant:0,fearful:1}},
{text:"나의 자율성과 개인 공간 유지",score:{secure:1,anxious:0,avoidant:3,fearful:1}},
{text:"내 복잡함을 이해하는 사람 찾기",score:{secure:0,anxious:1,avoidant:0,fearful:3}}]},
{text:"관계에서 갈등이 생기면, 나는 보통...",options:[
{text:"침착하게 해결책을 찾는다",score:{secure:3,anxious:0,avoidant:0,fearful:0}},
{text:"이야기할 때까지 불안하다",score:{secure:0,anxious:3,avoidant:0,fearful:1}},
{text:"이야기하기 전에 혼자 있을 시간이 필요하다",score:{secure:1,anxious:0,avoidant:3,fearful:1}},
{text:"압도되고 어떻게 반응해야 할지 모르겠다",score:{secure:0,anxious:1,avoidant:0,fearful:3}}]},
{text:"관계에서 신뢰는...",options:[
{text:"누군가를 알아가면서 자연스럽게 생긴다",score:{secure:3,anxious:0,avoidant:1,fearful:0}},
{text:"지속적인 확신과 검증이 필요하다",score:{secure:0,anxious:3,avoidant:0,fearful:1}},
{text:"천천히 생기고, 건강한 회의를 유지한다",score:{secure:1,anxious:0,avoidant:3,fearful:1}},
{text:"파도처럼 - 때로는 쉽게, 때로는 전혀 아니다",score:{secure:0,anxious:1,avoidant:0,fearful:3}}]}
];

const styles={
secure:{title:"안정 애착형",desc:"당신은 관계에 대해 건강하고 균형 잡힌 접근 방식을 가지고 있습니다. 친밀감과 독립성 모두 편안하고, 필요를 효과적으로 전달하며, 신뢰가 자연스럽게 형성됩니다.",traits:["정서적으로 안정적","경계 설정 능력","친밀감에 편안함","효과적인 의사소통"],growth:"안정적인 기반 덕분에 깊고 의미 있는 관계를 형성할 수 있습니다. 개방적인 소통과 공감으로 관계를 계속 발전시켜 나가세요."},
anxious:{title:"불안 애착형",desc:"친밀한 관계를 매우 소중히 여기며, 때로는 상대방의 감정에 대해 걱정할 수 있습니다. 큰 마음과 깊은 정서적 연결 능력을 가지고 있습니다.",traits:["높은 공감 능력","정서적 친밀감 중시","타인 감정에 직관적","열정적이고 배려심 많음"],growth:"자기 진정 기술을 연습하고 관계와 독립적인 자존감을 키우세요. 당신의 민감성은 자신감과 균형을 이룰 때 강점이 됩니다."},
avoidant:{title:"회피 애착형",desc:"독립성과 자립을 중요하게 생각합니다. 관계를 형성할 수 있지만, 어느 정도 정서적 거리와 개인 공간을 유지하는 것을 선호합니다.",traits:["자립적","독립적 사고","강한 경계","개인 성장 중시"],growth:"신뢰하는 사람들과 취약한 순간을 나누는 것에 도전해 보세요. 독립성은 가치 있으며, 정서적 개방성과 결합하면 더 깊은 관계를 형성할 수 있습니다."},
fearful:{title:"두려움-회피 애착형",desc:"친밀한 관계를 원하면서도 동시에 취약성을 두려워하는 복잡한 감정을 경험합니다. 이는 인간 복잡성에 대한 독특한 깊이와 이해를 만듭니다.",traits:["깊은 성찰 능력","높은 통찰력","복잡한 감정 범위","회복력"],growth:"자기 연민을 실천하고 안전한 사람들과 점진적으로 취약함을 드러내세요. 다양한 관점을 보는 능력은 깊은 연결로 이어질 수 있는 선물입니다."}
};

let q=0, answers=[];
function startTest(){document.getElementById('welcome').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();}
function render(){
let p=''; for(let i=0;i<questions.length;i++) p+=`<div class="bar ${i<q?'done':i===q?'active':''}"></div>`;
document.getElementById('progress').innerHTML=p;
document.getElementById('question').innerText=questions[q].text;
document.getElementById('options').innerHTML=questions[q].options.map((o,i)=>`<button class="btn" onclick="answer(${i})">${o.text}</button>`).join('');
}
function answer(i){answers.push(questions[q].options[i]); q++; if(q<questions.length) render(); else finish();}
function finish(){
const s={secure:0,anxious:0,avoidant:0,fearful:0};
answers.forEach(a=>Object.keys(s).forEach(k=>s[k]+=a.score[k]));
const r=Object.keys(s).reduce((a,b)=>s[a]>s[b]?a:b);
const d=styles[r];
document.getElementById('quiz').classList.add('hidden');
document.getElementById('result').classList.remove('hidden');
document.getElementById('title').innerText=d.title;
document.getElementById('desc').innerText=d.desc;
document.getElementById('growth').innerText=d.growth;
document.getElementById('traits').innerHTML=d.traits.map(t=>`<div class="trait">${t}</div>`).join('');
}
function restart(){location.reload();}
</script>
</body></html>
